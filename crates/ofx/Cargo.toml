[package]
name = "filmcraft-ofx"
description = "OpenFX (OFX 1.4) image-effect host: loads native OFX plug-in bundles and registers them as FilmCraft Video Effects (plug-in API v2). Native code, no sandbox; opt-in through the apps' `openfx` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately NOT `[lints] workspace = true`: a plug-in host has to speak the C ABI and call
# into native code, which needs `unsafe` (the workspace forbids it). With `crates/platform`, this
# is the only crate that uses `unsafe`; it is opt-in (only apps built with their `openfx` feature
# link it). Every `unsafe` block lives in this crate and sits behind `catch_unwind` + null/magic
# checks (see `ffi.rs`); the crate keeps the workspace's never-crash lints (see `lib.rs`).

[dependencies]
filmcraft-project = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

# Native plug-in binaries only exist on native targets (on wasm32 the crate is empty).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true }

[dev-dependencies]
filmcraft-project = { workspace = true }
serde_json = { workspace = true }
